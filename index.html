
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sakura OS Elite V2</title>
<style>
body{font-family:system-ui;background:#fff7fb;margin:0;padding:20px;color:#333}
.card{background:#fff;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
h1,h2{margin-top:0}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{background:#f7bfd7;border:none;padding:12px 18px;border-radius:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.big{font-size:28px;font-weight:bold}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
.barwrap{background:#eee;height:14px;border-radius:999px;overflow:hidden}
.bar{background:#f7bfd7;height:100%;width:0%}
</style>
</head>
<body>
<div class="card">
<h1>🌸 Sakura OS Elite V2</h1>
<p>Japan Expense Tracker + INR/JPY Dashboard</p>
</div>

<div class="card">
<h2>💴 Trip Dashboard</h2>
<div class="grid">
<div><div id="spentJPY" class="big">¥0</div>Total Spend</div>
<div><div id="spentINR" class="big">₹0</div>INR Equivalent</div>
<div><div id="remainINR" class="big">₹177000</div>Remaining Budget</div>
</div>
<br>
<label>Budget (₹)</label>
<input id="budget" type="number" value="177000">
<label>JPY → INR rate (default 0.58)</label>
<input id="rate" type="number" step="0.01" value="0.58">
<div class="barwrap"><div id="bar" class="bar"></div></div>
</div>

<div class="card">
<h2>➕ Add Expense</h2>
<input id="desc" placeholder="Description">
<select id="cat">
<option>🍜 Food</option>
<option>🚆 Transport</option>
<option>🛍 Shopping</option>
<option>🎟 Attractions</option>
<option>☕ Cafe</option>
<option>🎁 Souvenirs</option>
<option>💡 Opportunity</option>
<option>Other</option>
</select>
<input id="jpy" type="number" placeholder="Amount in JPY">
<button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h2>📊 Category Totals</h2>
<div id="totals"></div>
</div>

<div class="card">
<h2>📋 Expenses</h2>
<table id="tbl"></table>
</div>

<script>
function getData(){return JSON.parse(localStorage.getItem('expenses')||'[]')}
function saveData(x){localStorage.setItem('expenses',JSON.stringify(x))}

function addExpense(){
let arr=getData();
arr.push({
d:desc.value,
c:cat.value,
j:Number(jpy.value||0),
date:new Date().toLocaleDateString()
});
saveData(arr);
update();
}

function update(){
let arr=getData();
let rateV=Number(rate.value||0.58);
let budgetV=Number(budget.value||177000);

let totalJPY=arr.reduce((a,b)=>a+b.j,0);
let totalINR=Math.round(totalJPY*rateV);
let remain=budgetV-totalINR;

spentJPY.innerText='¥'+totalJPY.toLocaleString();
spentINR.innerText='₹'+totalINR.toLocaleString();
remainINR.innerText='₹'+remain.toLocaleString();

let pct=Math.min((totalINR/budgetV)*100,100);
bar.style.width=pct+'%';

let rows='<tr><th>Date</th><th>Category</th><th>Description</th><th>JPY</th><th>INR</th></tr>';
arr.forEach(x=>{
rows+=`<tr><td>${x.date}</td><td>${x.c}</td><td>${x.d}</td><td>¥${x.j}</td><td>₹${Math.round(x.j*rateV)}</td></tr>`;
});
tbl.innerHTML=rows;

let cats={};
arr.forEach(x=>cats[x.c]=(cats[x.c]||0)+x.j);
totals.innerHTML=Object.entries(cats).map(([k,v])=>
`<p>${k}: ¥${v.toLocaleString()} (₹${Math.round(v*rateV).toLocaleString()})</p>`).join('');
}
update();
budget.oninput=update;
rate.oninput=update;
</script>
</body>
</html>
