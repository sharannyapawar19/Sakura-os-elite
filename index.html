<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sakura OS V4</title>
<style>
body{font-family:system-ui;background:#fff5f9;margin:0;color:#333}
.hero{padding:25px;text-align:center;background:#ffe4ef}
.card{background:#fff;margin:12px;padding:16px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
input,textarea,select{width:100%;padding:8px;margin:5px 0;box-sizing:border-box}
button{background:#ffd6e7;border:none;padding:10px 14px;border-radius:10px;margin:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.done{text-decoration:line-through;opacity:.6}
</style></head><body>
<div class="hero"><h1>🌸 Sakura OS V4</h1><p>Japan Opportunity OS</p></div>

<div class="card">
<h3>📊 Dashboard</h3>
<div class="grid">
<div><b id="ppl">0</b><br>People</div>
<div><b id="opp">0</b><br>Opportunities</div>
<div><b id="gold">0</b><br>Gold Ideas</div>
<div><b id="bucketCount">0</b><br>Bucket Items</div>
</div>
</div>

<div class="card">
<h3>🤝 People Vault</h3>
<input id="pn" placeholder="Name">
<input id="pf" placeholder="Field">
<textarea id="pd" placeholder="Description"></textarea>
<input id="pp" placeholder="POC (LinkedIn/Insta)">
<select id="pi"><option>⭐</option><option>⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select>
<button onclick="addPerson()">Add Person</button>
<div id="peopleList"></div>
</div>

<div class="card">
<h3>💡 Opportunity Vault</h3>
<input id="on" placeholder="Idea / Product">
<input id="oi" type="file" accept="image/*">
<label>Potential (1-10)</label><input id="op" type="number" min="1" max="10">
<label>Difficulty (1-10)</label><input id="od" type="number" min="1" max="10">
<label>Excitement (1-10)</label><input id="oe" type="number" min="1" max="10">
<textarea id="onote" placeholder="Notes"></textarea>
<button onclick="addOpp()">Add Opportunity</button>
<div id="oppList"></div>
<h4>💎 Gold Mine</h4>
<div id="goldList"></div>
</div>

<div class="card">
<h3>💴 Expense Command Center</h3>
<input id="budget" type="number" value="70000" placeholder="Budget INR">
<input id="rate" type="number" value="0.58" step="0.01" placeholder="JPY->INR">

<input id="eday" placeholder="Day only (16,17,18...)">
<select id="ecat">
<option>Food</option><option>Clothes</option><option>Skincare</option><option>TO SELL</option><option>Other</option>
</select>
<input id="edesc" placeholder="Description">
<input id="einr" type="number" placeholder="₹ INR">
<input id="ejpy" type="number" placeholder="¥ JPY">
<button onclick="addExpense()">Add Expense</button>

<div id="expenseSummary"></div>
<div id="expenseList"></div>
</div>

<div class="card">
<h3>🌸 Bucket List</h3>
<input id="bt" placeholder="Add item">
<button onclick="addBucket()">Add</button>
<div id="bucket"></div>
</div>

<script>
const G=k=>JSON.parse(localStorage.getItem(k)||'[]');
const S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

function addPerson(){
let a=G('people');
a.push({n:pn.value,f:pf.value,d:pd.value,p:pp.value,i:pi.value});
S('people',a);render();
}
function addOpp(){
let a=G('opp');
a.push({n:on.value,p:+op.value||0,d:+od.value||0,e:+oe.value||0,note:onote.value});
S('opp',a);render();
}
function addExpense(){
let a=G('exp');
let r=+rate.value||0.58;
let inr=+einr.value||0;
let jpy=+ejpy.value||0;
if(inr && !jpy) jpy=Math.round(inr/r);
if(jpy && !inr) inr=Math.round(jpy*r);
a.push({date:eday.value+'/06/2026',cat:ecat.value,desc:edesc.value,inr,jpy});
S('exp',a);render();
}
function addBucket(){
let a=G('bucket');
a.push({t:bt.value,done:false});
S('bucket',a);render();
}
function toggleBucket(i){
let a=G('bucket'); a[i].done=!a[i].done; S('bucket',a); render();
}

function render(){
let people=G('people'), opps=G('opp'), exp=G('exp'), bucketA=G('bucket');

ppl.innerText=people.length;
opp.innerText=opps.length;
gold.innerText=opps.filter(x=>x.p>=8).length;
bucketCount.innerText=bucketA.length;

peopleList.innerHTML=people.map(x=>`<div class='card'>${x.i} <b>${x.n}</b><br>${x.f}<br>${x.d}<br>${x.p}</div>`).join('');

oppList.innerHTML=opps.map(x=>`<div class='card'><b>${x.n}</b><br>Potential:${x.p}/10 | Difficulty:${x.d}/10 | Excitement:${x.e}/10</div>`).join('');
goldList.innerHTML=opps.filter(x=>x.p>=8).map(x=>`💎 ${x.n}<br>`).join('');

let totalINR=exp.reduce((s,x)=>s+x.inr,0);
let totalJPY=exp.reduce((s,x)=>s+x.jpy,0);
expenseSummary.innerHTML=`<b>Spent:</b> ₹${totalINR} | ¥${totalJPY}<br><b>Remaining:</b> ₹${(+budget.value-totalINR)}`;

expenseList.innerHTML=exp.map(x=>`<div>${x.date} | ${x.cat} | ${x.desc} | ₹${x.inr} | ¥${x.jpy}</div>`).join('');

bucket.innerHTML=bucketA.map((x,i)=>`<div class='${x.done?'done':''}'><input type='checkbox' ${x.done?'checked':''} onchange='toggleBucket(${i})'> ${x.t}</div>`).join('');
}
render();
</script>
</body></html>
